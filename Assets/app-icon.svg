<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- 3D Perspective Grid / Isometric Plane -->
  <g stroke="#4338CA" stroke-width="2" stroke-opacity="0.5">
    <path d="M 96 360 L 256 440 L 416 360 L 256 280 Z" fill="#1E293B" fill-opacity="0.6"/>
    <path d="M 136 340 L 256 400 L 376 340"/>
    <path d="M 176 320 L 256 360 L 336 320"/>
    <path d="M 256 280 L 256 440"/>
  </g>

  <!-- Roblox 3D Cube / Avatar Head Symbol -->
  <g transform="translate(256, 230)">
    <!-- Top Face -->
    <polygon points="0,-70 70,-35 0,0 -70,-35" fill="#6366F1" filter="url(#glow)"/>
    <!-- Left Face -->
    <polygon points="-70,-35 0,0 0,70 -70,35" fill="#4F46E5"/>
    <!-- Right Face -->
    <polygon points="0,0 70,-35 70,35 0,70" fill="#4338CA"/>
    <!-- Roblox Inner Square Tilt -->
    <polygon points="0,-40 30,-25 0,-10 -30,-25" fill="#E0E7FF"/>
  </g>

  <!-- Targeting Reticle / Crosshair (Vision System) -->
  <g stroke="#06B6D4" stroke-width="5" fill="none">
    <circle cx="256" cy="230" r="115" stroke-dasharray="14 10" filter="url(#glow)"/>
    <!-- North Marker / Compass Indicator -->
    <polygon points="256,90 248,110 264,110" fill="#EF4444" stroke="#EF4444" stroke-width="2"/>
    <polygon points="256,370 248,350 264,350" fill="#94A3B8" stroke="#94A3B8" stroke-width="2"/>
    <!-- Reticle Ticks -->
    <line x1="256" y1="95" x2="256" y2="135"/>
    <line x1="256" y1="325" x2="256" y2="365"/>
    <line x1="121" y1="230" x2="161" y2="230"/>
    <line x1="351" y1="230" x2="391" y2="230"/>
  </g>

  <!-- Center Pin -->
  <circle cx="256" cy="230" r="6" fill="#10B981"/>
</svg>
